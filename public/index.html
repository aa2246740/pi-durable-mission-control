<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Mission Control · 持久代理工作台</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到主内容</a>
  <aside class="sidebar">
    <a class="brand" href="#missions"><span class="brand-mark">m<span>↗</span></span><span>Mission Control<small>持久代理工作台</small></span></a>
    <div class="workspace-label">你的控制中心</div>
    <nav aria-label="主导航" id="nav"></nav>
    <div class="sidebar-foot"><span class="connection-dot" id="connection-dot"></span><span id="connection">正在连接后台</span><small>界面关闭，后台继续运行<br>Powered by pi-durable</small></div>
  </aside>
  <div class="shell">
    <header class="topbar"><div id="breadcrumb">工作台 / Missions</div><div class="topbar-right"><span class="local-tag">独立运行 · BYOK</span><button class="icon-button" id="refresh" title="刷新" aria-label="刷新">↻</button></div></header>
    <main id="main" tabindex="-1"><div class="empty"><div class="spinner"></div><h2>连接你的工作台</h2><p>正在读取持久保存的任务与代理。</p></div></main>
    <footer class="page-footer">模型可以替换，工作不会随窗口消失。<span id="version"></span></footer>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-button" id="close-dialog" aria-label="关闭对话框">×</button></div><form id="form"><div id="form-fields"></div><p class="form-error" id="form-error" role="alert"></p><div class="dialog-actions"><button type="button" class="button secondary" id="cancel-dialog">取消</button><button type="submit" class="button" id="submit-dialog">保存</button></div></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
